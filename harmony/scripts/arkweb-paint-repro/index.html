<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The shell's probeServer() requires the page to contain packages/web's own
     <title> before it will accept the address, so this repro borrows it. -->
<title>CC Pet</title>
<style>
html,body,#root{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
body{background:#f8fafc;color:#fff;font-family:Monaco,monospace}
#root{display:flex;flex-direction:column}
.hdr{flex:0 0 auto;background:#fff;border-bottom:1px solid #e5e7eb;color:#1f2937;
     padding:6px 10px;font-size:11px;white-space:pre-wrap}
.wrap{position:relative;flex:1;min-height:0}
/* A tall scrolling layer is required: the same bubbles on a short,
   non-scrolling page never lose their background. */
.scroller{height:100%;overflow-y:auto;padding:8px 0}
.row{display:flex;justify-content:flex-end;padding:3px 10px}
.b{max-width:92%;min-width:0;overflow:hidden;border-radius:16px;border-bottom-right-radius:6px;
   padding:6px 12px;font-size:12px;line-height:1.4;color:#fff;background-color:#6366f1}
/* Heterogeneous paint properties are the trigger. 140 identical bubbles never
   fail; these nine variants interleaved make ~7% of them lose their
   background-color fill while their text (and any outline) still paints. */
.p1{will-change:transform}
.p2{transform:translateZ(0)}
.p3{border:3px solid #111}
.p4{box-shadow:0 0 0 3px #111}
.p5 span{background:#111;padding:1px 3px}
.p6{background-color:transparent;background-image:linear-gradient(#6366f1,#6366f1)}
.p7{outline:3px solid #111;outline-offset:-3px}
.p8{overflow:visible;border-radius:0}
</style>
</head>
<body>
<div id="root">
  <div class="hdr" id="h">CC Pet ArkWeb paint repro</div>
  <div class="wrap"><div class="scroller" id="s"></div></div>
</div>
<script>
var P = ['p0','p1','p2','p3','p4','p5','p6','p7','p8'];
var s = document.getElementById('s'), h = '';
for (var i = 0; i < 140; i++) {
  var p = P[i % P.length];
  var lbl = '#' + ('00' + i).slice(-3) + ' ' + p.toUpperCase();
  h += '<div class="row"><div class="b ' + p + '">' +
       (p === 'p5' ? lbl + ' <span>CHILD</span>' : lbl + ' ~~~~~~~~') +
       '</div></div>';
}
s.innerHTML = h;

// Renderer diagnostics, printed into the page so a screenshot carries them.
// On the x86 emulator every WebGL context comes back null, i.e. ArkWeb has no
// GPU path there at all; that is the single strongest reason to suspect this
// defect is emulator-only.
var d = 'dpr=' + window.devicePixelRatio + ' inner=' + window.innerWidth + 'x' + window.innerHeight +
        ' cores=' + navigator.hardwareConcurrency;
function ctx(n) { try { return document.createElement('canvas').getContext(n) ? 'ok' : 'null'; } catch (e) { return 'throw'; } }
d += '  2d=' + ctx('2d') + ' webgl=' + ctx('webgl') + ' webgl2=' + ctx('webgl2');
document.getElementById('h').textContent = d;
</script>
</body>
</html>
